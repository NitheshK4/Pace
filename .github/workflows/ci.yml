# Pace Continuous Integration Matrix
name: Pace Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-suite:
    name: API, Proxy, & Python SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -e ./packages/proxy
          pip install -e ./packages/python-sdk -e ./apps/api

      - name: Run Pytest suite
        run: |
          PYTHONPATH=apps/api:packages/python-sdk:packages/proxy pytest apps/api/tests packages/proxy/tests packages/python-sdk/tests

  typescript-and-web-suite:
    name: TypeScript SDK & Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Test TypeScript SDK
        run: |
          cd packages/typescript-sdk
          npm ci
          npm run build
          npm test

      - name: Build Web Frontend
        run: |
          cd apps/web
          npm ci
          npm run typecheck
          npm run build

  php-sdk-tests:
    name: PHP SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run PHP SDK Tests
        run: |
          php packages/php-sdk/run_tests.php

  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Docker Compose configuration
        run: |
          docker compose config
